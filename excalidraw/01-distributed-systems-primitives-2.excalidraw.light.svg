<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="665.5" class="excalidraw-svg" viewBox="0 0 1510 665.5"><defs><style>@font-face{font-family:Excalifont;src:url(data:font/woff2;base64,)}</style></defs><path fill="#dcdfe5" d="M0 0h1510v665.5H0z"/><text y="24.668" fill="#b75415" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="28" style="white-space:pre" transform="translate(40 10)">Fixed-Window Rate Limiting: the Boundary Burst</text><text y="17.62" fill="#343b41" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(40 50)">Counter resets at every window boundary. A client that saves traffic for the boundary can send 2x the limit in seconds</text><text y="42.62" fill="#343b41" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(40 50)">across the seam.</text><path fill="none" stroke="#687079" stroke-linecap="round" stroke-width="2" d="M100 552.5h1400m-1400 0h1400"/><path fill="none" stroke="#687079" stroke-linecap="round" stroke-width="2" d="M100 546.5v12m0-12v12"/><text y="17.62" fill="#1d2328" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(68 566.5)">00:00</text><text y="17.62" fill="#687079" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(10 588.5)">start of window 1</text><path fill="none" stroke="#687079" stroke-linecap="round" stroke-width="2" d="M700 546.5v12m0-12v12"/><text y="17.62" fill="#1d2328" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(668 566.5)">00:01</text><text y="17.62" fil