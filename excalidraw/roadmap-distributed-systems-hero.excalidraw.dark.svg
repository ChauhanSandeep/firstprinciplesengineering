" transform="translate(552 252)">• Distributed Locks + fencing</text><text y="14.977" fill="#c9d1d9" dominant-baseline="alphabetic" font-family="Virgil, Segoe UI Emoji" font-size="17" style="white-space:pre" transform="translate(552 288)">• MVCC and snapshot isolation</text><text y="14.977" fill="#c9d1d9" dominant-baseline="alphabetic" font-family="Virgil, Segoe UI Emoji" font-size="17" style="white-space:pre" transform="translate(552 324)">• Distributed Transactions (2PC, Saga)</text><text y="14.977" fill="#c9d1d9" dominant-baseline="alphabetic" font-family="Virgil, Segoe UI Emoji" font-size="17" style="white-space:pre" transform="translate(552 396)">What agreement costs you,</text><text y="14.977" fill="#c9d1d9" dominant-baseline="alphabetic" font-family="Virgil, Segoe UI Emoji" font-size="17" style="white-space:pre" transform="translate(552 432)">and when to refuse to pay it.</text><g stroke-linecap="round"><path fill="#5c3a10" stroke-width="0" d="m1049.13 140.18 460.31-2.13.69 57.86-458.71-.14"/><path fill="none" stroke="#f0883e" stroke-width="2" d="M1050 140c154.44.77 310.92 1.49 460 0m-460 0c103 .03 206.21.48 460 0m0 0c1.92 16.99-.55 29.11 0 56m0-56c0 12.46.89 22.99 0 56m0 0c-149.67 2.41-298.85 2.76-460 0m460 0c-137.89-.34-275.23-.69-460 0m0 0c-1.57-17.97-1.23-34.93 0-56m0 56c.61-14.41.07-28.86 0-56"/></g><text x="230" y="19.382" fill="#fff" dominant-baseline="alphabetic" font-family="Virgil, Segoe UI Emoji" font-size="22" style="white-space:pre" text-anchor="middle" transform="translate(1050 140)">3. Production</text><path fill="none" stroke="#30363d" stroke-linecap="round" d="M1050 196c105.5-.39 211.83-.21 460 0m-460 0c104.2 1.35 208.47 2.15 460 0m0 0c-1.08 85.31-2.67 171.48 0 404m0-404c-.77 89.18-.22 176.96 0 404m0 0c-122.64.33-247.53-.09-460 0m460 0c-132.79-2.01-265.06-2.24-460 0m0 0c1.6-87.31 2-172.65 0-404m0 404c-1.06-143.34-1.74-286.79 0-404"/><text y="14.977" fill="#c9d1d9" dominant-baseline="alphabetic" font-family="Virgil, Segoe UI Emoji" font-size="