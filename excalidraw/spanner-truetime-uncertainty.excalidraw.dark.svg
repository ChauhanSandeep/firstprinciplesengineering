<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="535" class="excalidraw-svg" viewBox="0 0 1100 535"><defs><style>@font-face{font-family:Excalifont;src:url(data:font/woff2;base64,)}@font-face{font-family:Excalifont;src:url(data:font/woff2;base64,)}</style></defs><path fill="#0d1117" d="M0 0h1100v535H0z"/><text y="24.668" fill="#ff8c42" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="28" style="white-space:pre" transform="translate(10 10)">TrueTime: The Uncertainty Interval ε</text><text y="17.62" fill="#8b949e" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(10 54)">TT.now() returns [earliest, latest]; commit wait flushes ε so timestamps reflect real order.</text><path fill="none" stroke="#8b949e" stroke-linecap="round" stroke-width="2" d="M50 270h1040M50 270h1040"/><text y="17.62" fill="#8b949e" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(977.628 285.158)">real time →</text><g fill-opacity=".6" stroke-linecap="round" stroke-opacity=".6"><path fill="#5c3a10" stroke-width="0" d="M440 240h260c13.33 0 20 6.67 20 20v40c0 13.33-6.67 20-20 20H440c-13.33 0-20-6.67-20-20v-40c0-13.33 6.67-20 20-20"/><path fill="none" stroke="#f0883e" stroke-width="2" d="M440 240h260m-260 0h260m0 0c13.33 0 20 6.67 20 20m-20-20c13.33 0 20 6.67 20 20m0 0v40m0-40v40m0 0c0 13.33-6.67 20-20 20m20-20c0 13.33-6.67 20-20 20m0 0H440m260 0H440m0 0c-13.33 0-20-6.67-20-20m20 20c-13.33 0-20-6.67-20-20m0 0v-40m0 40v-40m0 0c0-13.33 6.67-20 20-20m-20 20c0-13.33 6.67-20 20-20"/></g><text y="17.62" fill="#fff" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(420 200)">[earliest</text><text y="17.62" fill="#fff" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(670 200)">latest]</text><text y="19.382" fill="#fff" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="22" style="white-space:pre" transform="translate(510 258)">ε ≈ 1–7 ms</text><path fill="none" stroke="#f0883e" stroke-dasharray="8 10" stroke-linecap="round" stroke-width="2.5" d="M570 240v70"/><text y="17.62" fill="#f0883e" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(530 320)">true now</text><path fill="none" stroke="#3fb950" stroke-linecap="round" stroke-width="2" d="M770 270v150m0-150v150"/><text y="17.62" fill="#3fb950" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(750 430)">s (commit ts)</text><g stroke-linecap="round"><path fill="none" stroke="#3fb950" stroke-dasharray="8 10" stroke-width="2.5" d="M570 400h200"/><path fill="none" stroke="#3fb950" stroke-width="2.5" d="M746.51 408.55c6.78-2.47 13.57-4.94 23.49-8.55"/><path fill="none" stroke="#3fb950" stroke-width="2.5" d="M746.51 391.45c6.78 2.47 13.57 4.94 23.49 8.55"/></g><text y="17.62" fill="#3fb950" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(600 370)">commit wait ≈ ε</text><text y="17.62" fill="#8b949e" dominant-baseline="alphabetic" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20" style="white-space:pre" transform="translate(50 500)">After wait, no future TT.now().earliest can equal s — external consistency holds.</text></svg>