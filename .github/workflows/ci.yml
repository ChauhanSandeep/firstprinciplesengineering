name: CI

# Guards for the public repo. The (private) Obsidian vault is never present in
# CI, so this does NOT run a full site build — it enforces the invariants that
# can be checked from the tracked tree alone:
#   * privacy-guard — no synced vault content leaks into the public repo.
#   * check         — types compile, unit tests pass, build scripts parse.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-guard:
    name: Privacy guard (no vault content tracked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert only allowlisted content/** is tracked
        run: |
          # content/ is regenerated from the private vault by `npm run sync`
          # and must never be committed, except the hand-maintained landing/
          # about/account pages and static assets. Fail if anything else leaks.
          allowed_re='^content/(index\.md|about\.md|account\.md|signin\.md|_static/.*)$'
          tracked=$(git ls-files 'content/*' || true)
          blocked=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! [[ "$f" =~ $allowed_re ]]; then
              blocked="$blocked  - $f"$'\n'
            fi
          done <<< "$tracked"
          if [ -n "$blocked" ]; then
            echo "✋ Synced vault content is tracked in the public repo:"
            echo "$blocked"
            echo "Only content/index.md, content/about.md, content/account.md, content/signin.md and content/_static/** may be committed."
            exit 1
          fi
          echo "✅ No disallowed content/** files are tracked."

  check:
    name: Types, tests, and script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Quartz plugins
        # tsc needs the community plugins that live in the gitignored .quartz/
        # (imported as ../../.quartz/plugins by core files); fetch them first.
        run: npx quartz plugin install
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build scripts parse (syntax smoke test)
        run: |
          # These build/injector scripts run during `npm run build` but are not
          # covered by tsc (plain .mjs). A syntax error would only surface at
          # deploy time — catch it here instead.
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          echo "✅ All build scripts parse."
