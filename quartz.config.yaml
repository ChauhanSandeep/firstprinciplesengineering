# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: First Principles Engineering
  pageTitleSuffix: ""
  enableSPA: true
  # Wikipedia-style hover previews are disabled: on this site they added no
  # value and hurt UX by covering neighbouring content on hover.
  enablePopovers: false
  locale: en-US
  baseUrl: firstprinciplesengineering.tech
  ignorePatterns:
    - private
    - templates
    - _drafts
    - _scratch
    - scratch
    - drafts
    - .obsidian
    - .trash
    # Defense in depth: never render a raw Excalidraw source even if one
    # somehow lands in content/.
    - "**/*.excalidraw.md"
    - "**/*.excalidraw"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # Typography stack (per user spec):
      #   header  → Inter (600–700) for h1–h6, table headers, callout titles,
      #             and UI elements (sidebar, nav, search).
      #   body    → Atkinson Hyperlegible for body text, paragraphs, lists,
      #             table cells, and callout content. Designed for maximum
      #             character distinction / legibility on screens.
      #   code    → JetBrains Mono for code blocks and inline code.
      header: Inter
      body: Atkinson Hyperlegible
      code: JetBrains Mono
    colors:
      # "Blueprint & Notebook" identity — an engineer's drafting table.
      # Cool drafting-paper substrate, blueprint teal-ink for links/accent,
      # pencil-sienna for annotations. Deliberately steps off the warm
      # cream + terracotta look (which reads as a generic default) toward
      # a palette grounded in this site's real artifacts: hand-drawn
      # Excalidraw trade-off sketches and graph-paper engineering notes.
      lightMode:
        light: "#eef0ea" # cool drafting paper — page background
        lightgray: "#dee1d8" # paper surfaces / borders / card bg
        gray: "#79817b" # muted — secondary text / icons
        darkgray: "#464f4c" # subtext
        dark: "#141a19" # blue-black ink — primary text
        secondary: "#1c5f6b" # blueprint teal ink — links / primary accent
        tertiary: "#b4532a" # pencil sienna — annotations / second accent
        highlight: rgba(28, 95, 107, 0.08)
        textHighlight: rgba(28, 95, 107, 0.26)
      # Blueprint-dark companion — deep ink slate with lifted cyan + sienna.
      darkMode:
        light: "#0e1417" # deep ink slate — page background
        lightgray: "#1b2529" # lifted surfaces / borders / card bg
        gray: "#7c8b90" # muted
        darkgray: "#b6c2c3" # subtext
        dark: "#e7ece9" # cool off-white — primary text
        secondary: "#58b6c3" # blueprint cyan, lifted for dark
        tertiary: "#e0895c" # pencil sienna, lifted for dark
        highlight: rgba(88, 182, 195, 0.12)
        textHighlight: rgba(88, 182, 195, 0.3)
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: rose-pine-dawn
        dark: rose-pine-moon
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    options:
      layout: modern
    order: 50
    layout:
      position: right
      priority: 25
      condition: not-index
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/remove-draft
    enabled: true
  # SECOND publish gate. The sync script injects `publish: true` for
  # folder-allowlisted notes so this filter still accepts them.
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      # User-approved Option A: folder rows in the left explorer
      # should ONLY toggle expansion, never navigate. Topic landing
      # pages are still reachable from roadmaps, search, breadcrumbs,
      # and direct links.
      folderClickBehavior: collapse
      # Strip leading `NN-` ordering prefix and convert dashes/underscores to
      # spaces so vault folders like `01-Fundamentals/01-Concepts/...` display
      # as "Fundamentals / Concepts / ...". File titles are prettified at sync
      # time, but folder names live in `fileSegmentHint` (raw segment) which
      # this mapFn cleans up at render time. Function is serialized to the
      # client and re-evaluated there (see explorer.inline.ts).
      mapFn: |
        (node) => {
          if (!node || node.displayName == null) return;
          const cleaned = String(node.displayName)
            .replace(/^\d+[-_]/, "")
            .replace(/[-_]/g, " ")
            .trim();
          if (cleaned) node.displayName = cleaned;
        }
      # Keep utility pages out of the content navigation tree: `tags` (Quartz
      # default) plus the `account` and `signin` pages (reached via the top-bar
      # auth chip, not study notes). Without this, "Your account" / "Sign in"
      # show in the left explorer on every page, even for signed-out readers.
      filterFn: |
        (node) => node.slugSegment !== "tags" && node.slugSegment !== "account" && node.slugSegment !== "signin"
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    # Disabled: the local connections graph at the bottom of every page was
    # noise for this site and has been turned off.
    enabled: false
    options:
      localGraph:
        depth: 2
        showTags: false
    layout:
      position: afterBody
      priority: 90
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: header
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: false
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: header
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: header
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        Source (Quartz): https://github.com/jackyzha0/quartz
        RSS: /index.xml
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
